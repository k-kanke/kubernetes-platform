---
# ノード一覧。physical_host は topology.kubernetes.io/zone ラベルの値になる。
# physical_host が未設定のノードはラベル付けをスキップする（TODO: 実機を確認して埋める）。
all:
  vars:
    ansible_user: kanke
    ansible_ssh_private_key_file: ~/.ssh/kanke_lab_ed25519
    ansible_ssh_common_args: "-o IdentitiesOnly=yes"
  children:
    k8s_nodes:
      children:
        control_plane:
        workers:
    proxmox_hosts:
      hosts:
        pve-nec:
          # 現在は DHCP の 192.168.0.184。192.168.0.11 へ固定したらここを更新する。
          ansible_host: 192.168.0.184
          ansible_user: root
          nic_name: nic0   # Intel I219-V (e1000e)
    control_plane:
      hosts:
        ubuntu-26:
          ansible_host: 192.168.0.20
          # physical_host: TODO  # Windows PC (VMware Workstation) の名前を決めて設定
    workers:
      hosts:
        ubuntu-worker-01:
          ansible_host: 192.168.0.165
          # physical_host: TODO
        ubuntu-worker-02:
          ansible_host: 192.168.0.166
          # physical_host: TODO
        ubuntu-worker-03:
          ansible_host: 192.168.0.23
          physical_host: host-nec
