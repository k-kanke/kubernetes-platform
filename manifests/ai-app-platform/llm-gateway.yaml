# LLM gateway (ai-app-platform docs/multi-agent-permissions.md §3): the only workload that holds the provider API key.
# Implementer pods call it with a short-lived per-task token (Gemini CLI: GOOGLE_GEMINI_BASE_URL + GEMINI_API_KEY); it checks
# the token, allows only generate/count/embed on gemini-* models, enforces per-task and per-day request budgets, swaps in
# the real key and forwards. The key lives in Secret platform-system/llm-gateway-credentials (created by hand, never
# committed). Without it every call answers 503 and tasks fail with an explanation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: platform-system
  labels: { app.kubernetes.io/name: llm-gateway }
spec:
  replicas: 1 # budgets are counted in memory
  selector:
    matchLabels: { app.kubernetes.io/name: llm-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: llm-gateway }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: llm-gateway
          image: ghcr.io/k-kanke/ai-app-platform/llm-gateway:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: AAP_TOKEN_SECRET
              valueFrom:
                secretKeyRef: { name: control-plane-secrets, key: token-secret } # shared with the Control Plane
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: llm-gateway-credentials, key: GEMINI_API_KEY, optional: true }
            - { name: LLM_MAX_REQUESTS_PER_TASK, value: "400" }
            - { name: LLM_MAX_REQUESTS_PER_DAY, value: "3000" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: platform-system
  labels: { app.kubernetes.io/name: llm-gateway }
spec:
  selector: { app.kubernetes.io/name: llm-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Only Implementer pods of the multi-agent namespace may call the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway-ingress
  namespace: platform-system
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: llm-gateway }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: aap-agents }
          podSelector:
            matchLabels: { aap.dev/role: implementer }
      ports:
        - { protocol: TCP, port: 8080 }
