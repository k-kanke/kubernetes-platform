# Control Plane state (SQLite) lives on its own PVC. Back this up (plan-2 §9.1).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: control-plane-db
  namespace: platform-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path # manifests/storage/local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: platform-system
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: ai-app-platform
spec:
  replicas: 1 # SQLite on a RWO PVC: exactly one writer
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      serviceAccountName: control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/k-kanke/ai-app-platform/control-plane:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AAP_NAMESPACE
              value: aap-apps
            - name: AAP_DB_PATH
              value: /var/lib/aap/control-plane.db
            - name: AAP_INTERNAL_URL
              value: http://control-plane.platform-system.svc:8080
            - name: AAP_STORAGE_CLASS
              value: local-path # StorageClass for per-app Source/Data PVCs
            - name: AAP_AGENT_IMAGE
              value: ghcr.io/k-kanke/ai-app-platform/agent-runtime:latest
            - name: AAP_RUNTIME_IMAGE
              value: ghcr.io/k-kanke/ai-app-platform/app-runtime:latest
            - name: AAP_HELPER_IMAGE
              value: busybox:1.37
            - name: AAP_AGENT
              value: template # template (offline stub) | claude (needs INSTALL_CLAUDE image + agent-credentials)
            - name: AAP_AGENT_SECRET_NAME
              value: agent-credentials # optional Secret in aap-apps with ANTHROPIC_API_KEY
            - name: AAP_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-secrets # created out-of-band, never committed
                  key: token-secret
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db
              mountPath: /var/lib/aap
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: control-plane-db
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: platform-system
spec:
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
