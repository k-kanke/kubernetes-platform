apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: platform-system
---
# Least privilege: the Control Plane can only manage generated-app resources in
# aap-apps. No Secrets, no Pods/exec, no cluster-wide access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane
  namespace: aap-apps
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane
  namespace: aap-apps
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane
