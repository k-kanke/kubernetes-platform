apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: platform-system
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/part-of: ai-app-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: ghcr.io/k-kanke/ai-app-platform/portal:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CONTROL_PLANE_URL
              value: http://control-plane.platform-system.svc:8080
          readinessProbe:
            httpGet: { path: /new, port: http }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# Exposure (Tailscale / Ingress) is decided in Phase 0 "Gateway / access path".
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: platform-system
spec:
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 80
      targetPort: http
