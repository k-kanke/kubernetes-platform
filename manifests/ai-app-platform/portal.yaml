apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: platform-system
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/part-of: ai-app-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: ghcr.io/k-kanke/ai-app-platform/portal:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CONTROL_PLANE_URL
              value: http://control-plane.platform-system.svc:8080
          readinessProbe:
            httpGet: { path: /new, port: http }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: platform-system
spec:
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Public entry for the family: Cloudflare Tunnel -> ingress-nginx -> Portal.
# MUST be protected by Cloudflare Access (see ai-app-platform/docs/exposure.md);
# the Portal itself has no login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: platform-system
  annotations:
    # Progress is streamed over SSE: do not buffer, allow long-lived responses.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: portal.kanke-aap-gen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http
