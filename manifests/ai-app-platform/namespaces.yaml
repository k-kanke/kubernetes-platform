apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Generated apps and Agent Jobs live here. `baseline` is the strictest level that
# still allows the platform's short-lived helper Job (CHOWN/FOWNER/DAC_OVERRIDE);
# everything else is created with a restricted-compatible securityContext.
apiVersion: v1
kind: Namespace
metadata:
  name: aap-apps
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# Multi-agent tasks (docs/multi-agent-permissions.md in ai-app-platform): one workspace PVC per
# task plus short-lived Implementer / Publisher Jobs. Kept apart from aap-apps (family apps) so
# its network, quota and admission rules can be decided on their own. `restricted` is enforced:
# nothing here needs the CHOWN/FOWNER capabilities that the aap-apps helper Job uses.
apiVersion: v1
kind: Namespace
metadata:
  name: aap-agents
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
