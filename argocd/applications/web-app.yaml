apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: web-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/k-kanke/kubernetes-platform.git
    targetRevision: HEAD
    path: kubernetes/apps/web-app

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
