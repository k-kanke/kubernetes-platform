apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dev-workspace
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/k-kanke/kubernetes-platform.git
    targetRevision: HEAD
    path: kubernetes/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
