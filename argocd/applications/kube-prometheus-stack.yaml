apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kube-prometheus-stack
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.4

    helm:
      values: |
        # Grafana は k8s の外 (pve-nec 上の LXC, 192.168.0.13:3000) で動かす
        grafana:
          enabled: false

        prometheus:
          service:
            type: NodePort
            nodePort: 30090

        prometheusOperator:
          livenessProbe:
            initialDelaySeconds: 120
            timeoutSeconds: 5

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
