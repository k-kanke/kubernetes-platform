apiVersion: apps/v1
kind: Deployment

metadata:
  name: dev-workspace
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dev-workspace

  template:
    metadata:
      labels:
        app: dev-workspace

    spec:
      containers:
        - name: dev
          image: ghcr.io/k-kanke/dev-workspace:0.6

          command: ["sleep", "infinity"]

          ports:
            - containerPort: 3000

          volumeMounts:
            - name: workspace
              mountPath: /workspace

            - name: github-ssh
              mountPath: /root/.ssh/id_ed25519
              subPath: id_ed25519
              readOnly: true

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: dev-workspace

        - name: github-ssh
          secret:
            secretName: github-ssh
            defaultMode: 0600
