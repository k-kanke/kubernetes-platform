apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: apps

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: web-app
          image: ghcr.io/k-kanke/web-app:b26fabdec0f0f5df7c0f3ba377690fc4ea11218b
          ports:
            - containerPort: 3000
